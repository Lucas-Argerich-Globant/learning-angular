<h3 class="text-lg font-bold m-4">Counter Page</h3>
<section class="flex flex-col items-center gap-4">
  <p>Count: {{ count() }}</p>
  <div class="flex gap-4">
    <button class="cursor-pointer border border-gray-200 p-2 rounded-lg" (click)="increaseBy(-1)">
      -1
    </button>
    <button class="cursor-pointer border border-gray-200 p-2 rounded-lg" (click)="increaseBy(1)">
      +1
    </button>
  </div>
  <button class="cursor-pointer border border-gray-200 p-2 rounded-lg" (click)="resetCounter()">
    Reset
  </button>
</section>
